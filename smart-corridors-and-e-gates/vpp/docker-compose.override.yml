# Smart Corridors local addition (not part of the VPP release): docker compose merges this file
# automatically with docker-compose.yml. The release ships no restart policy, so a service that
# crashes once (e.g. during the start-up burst) would stay down. Bring every service back up.
#
# user "0:0": since v5_4.41.1 the images run as uid 10001, but the HWID computed by the licensing
# library as non-root differs from the one printed by license-manager (which runs as root), so
# licenses issued for the documented HWID are rejected ("License has different HWID than this
# machine"). Running as root restores the pre-4.41.1 behaviour until VPP ships a matching HWID tool.
services:
  base:
    restart: unless-stopped
    user: "0:0"
  streamdatadbworker:
    restart: unless-stopped
    user: "0:0"
  grouping:
    restart: unless-stopped
    user: "0:0"
  cam-1:
    restart: unless-stopped
    user: "0:0"
