# Smart Corridors local addition (not part of the VPP release): docker compose merges this file
# automatically with docker-compose.yml. It adds three things to every service.
#
# restart: unless-stopped — the release ships no restart policy, so a service that crashes once
# (e.g. during the start-up burst) would stay down.
#
# container_name — the release lets Compose generate names (vpp-cam-1-1). These are the SmartFace
# service names the platform itself uses, so "docker ps" lines up with the "OS service name" shown
# in SF Station and with --serviceName above: SFCam1 in the UI is the SFCam1 container. Services
# keep their Compose service name as a network alias, so cam-1, api, graphql-api still resolve.
# (cam-nx's --serviceName is the fixed NX integration GUID; SFCamNx is used here for readability.)
#
# user: root — since v5_4.41.1 the images run as uid 10001, but the licensing library reads
# hardware identifiers that only root can access, so as non-root it derives a different HWID and
# rejects licenses issued for the HWID printed by license-manager ("License has different HWID than
# this machine"). Confirmed by the VPP team. Applied to the 21 services that load a biometric engine
# or match templates; verified empirically on v5_4.43.0.10149 (the other 7 run fine as uid 10001).
# Remove once VPP licensing works for uid 10001.
services:
  base:
    container_name: SFBase
    restart: unless-stopped
    user: root
  streamdatadbworker:
    container_name: SFStreamDataDbWorker
    restart: unless-stopped
