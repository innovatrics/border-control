      Aggregation__MatchRequestParallelism:
      Aggregation__Export:
      Aggregation__EntityNotificationsEnabled:
    labels:
      !!merge <<: [*labels-logging, *labels-application]
  video-collector:
    image: ${REGISTRY}video-collector:${VERSION}
    !!merge <<: *common
