name: vpp
x-common: &common
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
    memlock:
      soft: -1
      hard: -1
  volumes:
    - ./iengine.lic:/etc/innovatrics/iengine.lic
# RabbitMQ, logging and health checks – consumed by every service.
x-common-env: &common-env
  RabbitMQ__Hostname:
  RabbitMQ__Username:
  RabbitMQ__Password:
  RabbitMQ__VirtualHost:
  RabbitMQ__Port:
  RabbitMQ__UseSsl:
  AppSettings__Log_RollingFile_Enabled:
  AppSettings__Log_RollingFile_Directory:
  AppSettings__Log_RollingFile_MaxSizeMB:
  AppSettings__Log_RollingFile_MaxFiles:
  AppSettings__Log_RabbitMq_Enabled:
  AppSettings__Log_JsonConsole_Enabled:
  Serilog__MinimumLevel__Default:
  Serilog__MinimumLevel__Override__Microsoft:
  Serilog__MinimumLevel__Override__Microsoft.AspNetCore:
  Serilog__MinimumLevel__Override__Microsoft.Hosting.Lifetime:
  Serilog__MinimumLevel__Override__System:
  HealthCheck__Host:
  HealthCheck__Port:
x-db-env: &db-env
  ConnectionStrings__CoreDbContext:
  Database__DbEngine:
  Database__ExtendedCommandTimeoutSeconds:
x-s3-env: &s3-env
  S3Bucket__Endpoint:
  S3Bucket__BucketName:
  S3Bucket__BucketRegion:
  S3Bucket__Folder:
  S3Bucket__AccessKey:
  S3Bucket__SecretKey:
  S3Bucket__AuthenticationType:
  S3Bucket__UseBucketRegion:
x-mqtt-env: &mqtt-env
  MQTT__Hostname:
  MQTT__Username:
  MQTT__Password:
  MQTT__Port:
  MQTT__UseSsl:
x-otel-metrics-prometheus-env: &otel-metrics-prometheus-env
  OTEL_METRICS_EXPORTER:
  OTEL_EXPORTER_PROMETHEUS_HOST:
  OTEL_EXPORTER_PROMETHEUS_PORT:
x-tracing-env: &tracing-env
  Tracing__Enabled:
  OTEL_TRACES_SAMPLER:
  OTEL_TRACES_SAMPLER_ARG:
  OTEL_EXPORTER_OTLP_ENDPOINT:
x-gpu-env: &gpu-env
  Gpu__GpuEnabled:
  Gpu__GpuDeviceIndex:
  Gpu__GpuNeuralRuntime:
x-onnx-env: &onnx-env
  OnnxRuntimeConfiguration__SolverInterThreads:
  OnnxRuntimeConfiguration__SolverIntraThreads:
x-iface-env: &iface-env
  IFaceConfiguration__ThreadNum:
  IFaceConfiguration__ThreadManagementMode:
x-metrics-bands-env: &metrics-bands-env
  Metrics__RequestsProcessingTimeHistogramBands:
# Authentication / multitenancy – consumed by api, graphql-api and the sync leader.
x-auth-env: &auth-env
  Authentication__UseAuthentication:
  Authentication__IgnoreHttpsIssuerCheck:
  Authentication__Authority:
  Authentication__Audience:
  Authentication__SwaggerAuthConfig__ClientCredsTokenUrl:
  Authentication__SwaggerAuthConfig__AuthCodeTokenUrl:
  Authentication__SwaggerAuthConfig__AuthCodeAuthorizeUrl:
  Multitenancy__UseMultitenancy:
  Multitenancy__TenantClaimName:
# Save strategies – consumed by cam and edge-stream-processor.
x-save-strategies-env: &save-strategies-env
  BalancedFaceStrategy__QualityStep:
  BalancedFaceStrategy__MatchScoreStep:
  MatchedOnlyFaceStrategy__MatchScoreStep:
  BalancedPedestrianStrategy__QualityStep:
  BalancedGenericObjectStrategy__QualityStep:
  BalancedGenericObjectStrategy__MatchScoreStep:
  MatchedOnlyObjectStrategy__MatchScoreStep:
# Camera-specific settings shared by every cam instance.
x-cam-env: &cam-env
  NoSqlDataStorageDisabled:
  Rpc__TimeoutMs:
  GstPipelineTemplate:
  CropConfiguration__BackgroundColor:
  Notifications__IncludeTemplates:
  ObjectLinking__Enabled:
  StreamVisualization__StreamOnlyProcessed:
  StreamVisualization__BufferingFramesCount:
  StreamVisualization__InterpolateBoundingBoxes:
  TrackingConfiguration__MaxOldnessDetectionFrames:
x-labels-logging: &labels-logging
  logging: promtail
x-labels-metrics: &labels-metrics
  scrapeMetrics: "true"
x-labels-application: &labels-application
  application: "smartface"
services:
  base:
    image: ${REGISTRY}base:${VERSION}
    command: --serviceName SFBase
    !!merge <<: *common
    ports:
      - 2406:2406
    environment:
      !!merge <<: [*common-env, *db-env, *s3-env, *otel-metrics-prometheus-env, *tracing-env, *gpu-env, *iface-env, *metrics-bands-env]
      NoSqlDataStorageDisabled:
      DbCleanUp__BatchSize:
      VideoRecordSlicing__ChunkLength:
      TrackletRecovery__TrackletRecoveryTriggerPeriodSeconds:
      TrackletRecovery__MinimumVisualObjectAgeForTrackletRecoverySeconds:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  streamdatadbworker:
    image: ${REGISTRY}streamdatadbworker:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *db-env, *s3-env, *otel-metrics-prometheus-env, *tracing-env]
      NoSqlDataStorageDisabled:
      StreamDataConsumer__BlobProcessorCount:
      StreamDataConsumer__BatchSize:
    labels:
      !!merge <<: [*labels-logging, *labels-application]
    expose:
      - 4318
  grouping:
    image: ${REGISTRY}grouping:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *db-env, *otel-metrics-prometheus-env, *tracing-env, *iface-env, *metrics-bands-env]
      Grouping__TemplateQualityThreshold:
      LiveGrouping__UpdateTimeMs:
      LiveGrouping__DelayOffsetMs:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  cam-1:
    image: ${REGISTRY}cam:${VERSION}
    command: --serviceName SFCam1
    !!merge <<: *common
    ports:
      - 30001:30001
    environment:
      !!merge <<: [*common-env, *db-env, *s3-env, *otel-metrics-prometheus-env, *tracing-env, *gpu-env, *iface-env, *cam-env, *save-strategies-env]
      SF_OPENCV_API:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  cam-2:
    image: ${REGISTRY}cam:${VERSION}
    command: --serviceName SFCam2
    !!merge <<: *common
    ports:
      - 30002:30002
    environment:
      !!merge <<: [*common-env, *db-env, *s3-env, *otel-metrics-prometheus-env, *tracing-env, *gpu-env, *iface-env, *cam-env, *save-strategies-env]
      SF_OPENCV_API:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  cam-3:
    image: ${REGISTRY}cam:${VERSION}
    command: --serviceName SFCam3
    !!merge <<: *common
    ports:
      - 30003:30003
    environment:
      !!merge <<: [*common-env, *db-env, *s3-env, *otel-metrics-prometheus-env, *tracing-env, *gpu-env, *iface-env, *cam-env, *save-strategies-env]
      SF_OPENCV_API:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  cam-4:
    image: ${REGISTRY}cam:${VERSION}
    command: --serviceName SFCam4
    !!merge <<: *common
    ports:
      - 30004:30004
    environment:
      !!merge <<: [*common-env, *db-env, *s3-env, *otel-metrics-prometheus-env, *tracing-env, *gpu-env, *iface-env, *cam-env, *save-strategies-env]
      SF_OPENCV_API:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  cam-5:
    image: ${REGISTRY}cam:${VERSION}
    command: --serviceName SFCam5
    !!merge <<: *common
    ports:
      - 30005:30005
    environment:
      !!merge <<: [*common-env, *db-env, *s3-env, *otel-metrics-prometheus-env, *tracing-env, *gpu-env, *iface-env, *cam-env, *save-strategies-env]
      SF_OPENCV_API:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  cam-nx:
    image: ${REGISTRY}cam:${VERSION}
    # Guid needs to match ServiceInstallNames.NX_TEST_CAMERA_GUID
    command: --serviceName 53b4d78e-323f-4a0f-aa6d-99c464448b6d
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *db-env, *s3-env, *otel-metrics-prometheus-env, *tracing-env, *gpu-env, *iface-env, *cam-env, *save-strategies-env]
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  graphql-api:
    image: ${REGISTRY}graphql-api:${VERSION}
    !!merge <<: *common
    ports:
      # we forward the configured ports to default SF ports
      - 8097:${Hosting__Port}
    environment:
      !!merge <<: [*common-env, *db-env, *mqtt-env, *otel-metrics-prometheus-env, *tracing-env, *auth-env]
      Hosting__Host:
      Hosting__Port:
      AllowedHosts:
      HealthCheck__Tags__db:
      HealthCheck__Tags__rmq:
      Notifications__IncludeTemplates:
    labels:
      !!merge <<: [*labels-logging, *labels-application]
  api:
    image: ${REGISTRY}api:${VERSION}
    !!merge <<: *common
    ports:
      # we forward the configured ports to default SF ports
      - 8098:${Hosting__Port}
    environment:
      !!merge <<: [*common-env, *db-env, *s3-env, *mqtt-env, *otel-metrics-prometheus-env, *tracing-env, *auth-env]
      # service-specific overrides of shared defaults (appsettings values)
      Serilog__MinimumLevel__Override__Microsoft: Debug
      Rpc__TimeoutMs: 6000
      Hosting__Host:
      Hosting__Port:
      AllowedHosts:
      HealthCheck__Tags__db:
      HealthCheck__Tags__rmq:
      NoSqlDataStorageDisabled:
      CameraDefaults__PreviewPort:
      FeatureManagement__Watchlist:
      FeatureManagement__Edge:
      FeatureManagement__Full:
      FeatureManagement__Detection:
      FeatureManagement__ReadOnlyWatchlists:
      Totp__QrCodeImageEndpointEnabled:
      Totp__Digits:
      Totp__PeriodSeconds:
      Totp__Algorithm:
      VectorDB__Provider:
      VectorDB__RerankQueryLimitA:
      VectorDB__RerankQueryLimitB:
      Milvus__Endpoint:
      Milvus__UseAuthentication:
      Milvus__Username:
      Milvus__Password:
      Milvus__Token:
      WatchlistDeleter__WatchlistMemberUnlinkBatchSize:
      FaceValidation__Size__Min:
      FaceValidation__Size__Max:
      FaceValidation__AreaOnFrame__Min:
      FaceValidation__AreaOnFrame__Max:
      FaceValidation__TemplateQuality__Min:
      FaceValidation__TemplateQuality__Max:
      FaceValidation__FaceQuality__Min:
      FaceValidation__FaceQuality__Max:
      FaceValidation__YawAngle__Min:
      FaceValidation__YawAngle__Max:
      FaceValidation__PitchAngle__Min:
      FaceValidation__PitchAngle__Max:
      FaceValidation__RollAngle__Min:
      FaceValidation__RollAngle__Max:
      FaceValidation__Brightness__Min:
      FaceValidation__Brightness__Max:
      FaceValidation__Sharpness__Min:
      FaceValidation__Sharpness__Max:
      PalmValidation__PalmQuality__Min:
      PalmValidation__PalmQuality__Max:
      Statistics__SendStatisticsData:
      Statistics__TransactionCountingSystemUrl:
      Statistics__Authentication__CrmToken:
      Statistics__Authentication__OAuth__TokenEndpoint:
      Statistics__Authentication__OAuth__Audience:
      Statistics__Authentication__OAuth__ClientId:
      Statistics__Authentication__OAuth__ClientSecret:
      Statistics__TransactionsPublishBatchSize:
      Statistics__TransactionsPublishTimeoutMs:
      Statistics__TransactionsPublishIntervalMs:
      Statistics__TransactionsPublishRetryBackoffMs:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  detector:
    image: ${REGISTRY}detector:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *otel-metrics-prometheus-env, *tracing-env, *gpu-env, *onnx-env, *iface-env, *metrics-bands-env]
      CropConfiguration__BackgroundColor:
      Warmup__DetectionAlgorithms:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  pedestrian-detector:
    image: ${REGISTRY}pedestrian-detector:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *otel-metrics-prometheus-env, *tracing-env, *gpu-env, *onnx-env, *iface-env, *metrics-bands-env]
