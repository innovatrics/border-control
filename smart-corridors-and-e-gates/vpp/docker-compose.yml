      S3ClientLifetime__S3ClientLifetime:
    labels:
      !!merge <<: [*labels-logging, *labels-application]
  video-reader:
    image: ${REGISTRY}video-reader:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *s3-env, *otel-metrics-prometheus-env, *tracing-env]
      ActivityMonitor__WarningTimeMinutes:
      ActivityMonitor__ErrorTimeMinutes:
    labels:
      !!merge <<: [*labels-logging, *labels-application]
  edge-stream-processor:
    image: ${REGISTRY}edge-stream-processor:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *db-env, *otel-metrics-prometheus-env, *tracing-env, *onnx-env, *save-strategies-env]
      Serilog__MinimumLevel__Override__Microsoft: Debug
      Rpc__TimeoutMs:
      NoSqlDataStorageDisabled:
      ObjectLinking__Enabled:
      Notifications__IncludeTemplates:
      FrameDataProcessing__ForceExtractionOfIncompatibleFaceTemplates:
      EdgeStreamRmqConsumer__ExchangeName:
      EdgeStreamRmqConsumer__QueueName:
      EdgeStreamRmqConsumer__RoutingKey:
    labels:
      !!merge <<: [*labels-logging, *labels-application]
  edge-streams-state-synchronizer:
    image: ${REGISTRY}edge-streams-state-synchronizer:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *db-env, *mqtt-env, *otel-metrics-prometheus-env, *tracing-env]
      Rpc__TimeoutMs: 10000
      RabbitMQ__StreamsPort:
      NoSqlDataStorageDisabled:
      SynchronizationConfig__UpdateLogReadBatchCount:
      SynchronizationConfig__BatchTriggerMs:
    labels:
      !!merge <<: [*labels-logging, *labels-application]
  pedestrian-extractor:
    image: ${REGISTRY}pedestrian-extractor:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *otel-metrics-prometheus-env, *tracing-env, *gpu-env, *onnx-env, *metrics-bands-env]
