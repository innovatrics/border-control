      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  extractor:
    image: ${REGISTRY}extractor:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *otel-metrics-prometheus-env, *tracing-env, *gpu-env, *onnx-env, *iface-env, *metrics-bands-env]
      Serilog__MinimumLevel__Override__Microsoft: Debug
      Extraction__Algorithm:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  matcher:
    image: ${REGISTRY}matcher:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *db-env, *otel-metrics-prometheus-env, *tracing-env, *metrics-bands-env]
      WatchlistMatcher__SeedPageSize:
      Matching__ThreadCount:
      Multitenancy__TenantId:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  face-matcher:
    image: ${REGISTRY}face-matcher:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *db-env, *otel-metrics-prometheus-env, *tracing-env, *iface-env, *metrics-bands-env]
      FaceMatcher__SeedPageSize:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  liveness:
    image: ${REGISTRY}liveness:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *otel-metrics-prometheus-env, *tracing-env, *gpu-env, *onnx-env, *iface-env, *metrics-bands-env]
      Serilog__MinimumLevel__Override__Microsoft: Debug
      Liveness__DistantAlgorithm:
      Warmup__LivenessAlgorithms:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  video-aggregator:
    image: ${REGISTRY}video-aggregator:${VERSION}
    !!merge <<: *common
