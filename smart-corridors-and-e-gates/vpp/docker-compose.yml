      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  object-detector:
    image: ${REGISTRY}object-detector:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *otel-metrics-prometheus-env, *tracing-env, *gpu-env, *onnx-env, *metrics-bands-env]
      Detection__Algorithm:
      Detection__ClassThreshold:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics, *labels-application]
    expose:
      - 4318
  palm-detector:
    image: ${REGISTRY}palm-detector:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *otel-metrics-prometheus-env, *tracing-env, *onnx-env, *metrics-bands-env]
      # palm-detector needs SolverIntraThreads=4; the .env default (1) only applies to InterThreads.
      OnnxRuntimeConfiguration__SolverIntraThreads: 4
      Warmup__LivenessEnabled:
      Detection__SolverName:
    labels:
      !!merge <<: [*labels-logging, *labels-metrics]
    expose:
      - 4318
  palm-extractor:
    image: ${REGISTRY}palm-extractor:${VERSION}
    !!merge <<: *common
    environment:
      !!merge <<: [*common-env, *otel-metrics-prometheus-env, *tracing-env, *onnx-env, *metrics-bands-env]
      # palm-extractor needs SolverIntraThreads=4; the .env default (1) only applies to InterThreads.
      OnnxRuntimeConfiguration__SolverIntraThreads: 4
