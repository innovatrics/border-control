services:
  hub:
    image: ${REGISTRY}corridor-hub:${HUB_VERSION}
    container_name: sceg-hub
    restart: unless-stopped
    ports:
      - "8090:8090"
    env_file:
      - ./.env.hub
    environment:
      STORAGE_S3_ENDPOINT: http://seaweedfs:8333
    # Fail-closed SmartCorridor license gate: the hub refuses to start unless the mounted
    # iengine.lic carries a valid, unexpired smart_corridor.hub block. One universal iengine.lic is
    # shared by every service — VPP/CIGS read its iengine block, hub/frontend the smart_corridor block.
    volumes:
      - ./secrets/iengine.lic:/etc/innovatrics/iengine.lic:ro

  cigs:
    image: ${REGISTRY}corridor-identity-grouping-service:${CIGS_VERSION}
    container_name: sceg-cigs
    restart: unless-stopped
    # restart: only fires on process exit — a hung JVM (e.g. the 2026-07-14 crash-handler zombie,
    # where PID 1 stayed alive but served nothing) needs healthcheck + autoheal to recover.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    labels:
      sceg-autoheal: "true"
    ports:
      - "8096:80"
    environment:
      # No OTLP collector on localhost:4317 in this setup ⇒ silence tracing export.
      TRACING_ENABLED: "false"
      CORRIDOR_IDENTITY_GROUPING_SOURCE_GRAPHQL_HOST: graphql-api
      CORRIDOR_IDENTITY_GROUPING_SOURCE_GRAPHQL_PORT: 80
      CORRIDOR_IDENTITY_GROUPING_STREAMS_APPLY_FOR_ALL_STREAMS: "true"
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_REQUIRE_FACE_TEMPLATE: "true"
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_FACE_SIZE_MIN: 15
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_FACE_QUALITY_MIN: 100
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_TEMPLATE_QUALITY_MIN: 60
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_YAW_ANGLE_MIN: -50
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_YAW_ANGLE_MAX: 50
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_PITCH_ANGLE_MIN: -50
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_PITCH_ANGLE_MAX: 50
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_ROLL_ANGLE_MIN: -50
      CORRIDOR_IDENTITY_GROUPING_FACE_FILTER_ROLL_ANGLE_MAX: 50
      CORRIDOR_IDENTITY_GROUPING_GROUPING_VERIFICATION_SCORE_THRESHOLD: 35
    volumes:
      - ./secrets/iengine.lic:/etc/innovatrics/iengine.lic:ro

  # NOTE: hub has no healthcheck — its buildpack image ships no shell/curl, so there is nothing
  # to exec the probe with. Revisit if the hub image ever gains a probe binary.
  frontend:
    image: ${REGISTRY}corridor-operational-display:${FRONTEND_VERSION}
    container_name: sceg-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      sceg-autoheal: "true"
    ports:
      - "${FRONTEND_PORT:-8095}:80"
    environment:
      HUB_URL: http://sceg-hub:8090
      SMARTFACE_GQL_URL: http://graphql-api:80
      SMARTFACE_API_URL: http://api:80
      # SmartFace Station powers the live camera preview (operational-display 0.5.0). The
      # frontend's nginx proxies the SPA's /smartface-video/<cameraId> WS to Station's /-/video bridge,
      # so this is an in-network container URL like the two above — sf-station runs alongside
      # the frontend on vpp-network, published on :8000. Unset ⇒ Cameras panel shows
      # "unavailable".
      SMARTFACE_STATION_URL: http://sf-station:8000
    # Fail-closed operational_display license gate: the frontend serves a "not licensed"
    # page unless the mounted iengine.lic carries a valid smart_corridor.operational_display block
    # (same universal iengine.lic as the hub and CIGS).
    volumes:
      - ./secrets/iengine.lic:/etc/innovatrics/iengine.lic:ro

  # Restarts any container labeled sceg-autoheal=true once Docker marks it unhealthy. Plain Docker
  # never restarts unhealthy containers on its own (restart policies react to exits only).
  # Needs the docker socket, so it can restart peers — keep this service pinned and minimal.
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: sceg-autoheal
    restart: unless-stopped
    environment:
      AUTOHEAL_CONTAINER_LABEL: sceg-autoheal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  sf-station:
    # SmartFace Station UI, kept for backward compatibility (the VPP release no longer ships it).
    image: ${REGISTRY}vpp/sf-station:${SFS_VERSION}
    container_name: sf-station
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./.env.sfstation
    environment:
      # host name the browser uses to reach the S3 storage; exported by start.sh
      S3_PUBLIC_ENDPOINT: http://${SFS_PUBLIC_HOST:-localhost}:8333
    volumes:
      - ./secrets/iengine.lic:/etc/innovatrics/iengine.lic:ro
    # Station inlines these Smart Corridors brand assets at startup.
      - ./vpp/branding/sf-station/logo-product.svg:/build/branding/logo-product.svg:ro
      - ./vpp/branding/sf-station/logo-product-without-text.svg:/build/branding/logo-product-without-text.svg:ro
      - ./vpp/branding/sf-station/favicon-product.ico:/build/branding/favicon-product.ico:ro
      - ./vpp/branding/sf-station/naming-product.json:/build/branding/naming-product.json:ro

networks:
  default:
    name: vpp-network
    external: true
