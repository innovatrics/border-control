# Face Matcher Station. The platform is started first by start.sh (platform/run.sh).
name: face-matcher-station

services:
  station:
    image: ${REGISTRY}sf-station:${STATION_VERSION}
    container_name: fm-station
    restart: unless-stopped
    ports:
      - "${STATION_PORT:-8000}:8000"
    env_file:
      - ./.env.station
    environment:
      # Browser-reachable address of the S3 storage; start.sh sets STATION_PUBLIC_HOST.
      S3_PUBLIC_ENDPOINT: http://${STATION_PUBLIC_HOST:-localhost}:8333
      IDENTIFICATION_ENABLED: "${STATION_IDENTIFICATION:-true}"
    volumes:
      - ./secrets/iengine.lic:/etc/innovatrics/iengine.lic:ro
      - ./branding/station/logo-product.svg:/build/branding/logo-product.svg:ro
      - ./branding/station/logo-product-without-text.svg:/build/branding/logo-product-without-text.svg:ro
      - ./branding/station/favicon-product.ico:/build/branding/favicon-product.ico:ro
      - ./branding/station/naming-product.json:/build/branding/naming-product.json:ro

networks:
  default:
    name: face-matcher-network
    external: true
