# Not part of the release package. Adds restart: unless-stopped to every service and user: root to the
# 17 services that load a biometric engine or match templates. Since v5_4.41.1 the images run as uid 10001,
# but the licensing library reads root-only hardware identifiers, derives a different HWID and rejects the
# license ("License has different HWID than this machine"). Verified on v5_4.43.0.10149; the other 5 services
# run as uid 10001. Remove user: root once licensing works for uid 10001.
services:
  base:
    restart: unless-stopped
    user: root
  streamdatadbworker:
    restart: unless-stopped
  cam-1:
    restart: unless-stopped
    user: root
  cam-2:
    restart: unless-stopped
    user: root
  cam-3:
    restart: unless-stopped
    user: root
  cam-4:
    restart: unless-stopped
    user: root
  cam-5:
    restart: unless-stopped
    user: root
  cam-nx:
    restart: unless-stopped
    user: root
  graphql-api:
    restart: unless-stopped
  api:
    restart: unless-stopped
    user: root
  detector:
    restart: unless-stopped
    user: root
  pedestrian-detector:
    restart: unless-stopped
    user: root
  extractor:
    restart: unless-stopped
    user: root
  matcher:
    restart: unless-stopped
    user: root
  face-matcher:
    restart: unless-stopped
    user: root
  liveness:
    restart: unless-stopped
    user: root
  edge-stream-processor:
    restart: unless-stopped
    user: root
  edge-streams-state-synchronizer:
    restart: unless-stopped
  pedestrian-extractor:
    restart: unless-stopped
    user: root
  object-detector:
    restart: unless-stopped
    user: root
  db-synchronization-leader:
    restart: unless-stopped
  db-synchronization-follower:
    restart: unless-stopped
