name: vpp-dependencies
services:
  pgsql:
    extends:
      service: common
      file: docker-compose-common.yml
    image: postgres:14.3
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=smartface
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Test1234
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB'"]
      start_period: 5s
      start_interval: 1s
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      default:
        aliases:
          - pgsql
    volumes:
      - pgsqldata:/var/lib/postgresql/data
  pgadmin:
    extends:
      service: common
      file: docker-compose-common.yml
    image: "dpage/pgadmin4:6.10"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: Test1234
      PGADMIN_SERVER_JSON_FILE: /tmp/servers.json
    configs:
      - source: pgadmin_servers_json
        target: /tmp/servers.json
    ports:
      - "7070:80"
  rabbitmq:
    extends:
      service: common
      file: docker-compose-common.yml
    image: rabbitmq:4.3.6-management
    configs:
      - source: rabbitmq_config
        target: /etc/rabbitmq/external/rabbitmq.conf
      - source: rabbitmq_enabled_plugins
        target: /etc/rabbitmq/external/enabled_plugins
    ports:
      - "15672:15672"
      - "5672:5672"
      - "1883:1883"
      - "5552:5552/tcp"
    environment:
      RABBITMQ_NODENAME: rabbit@rmq
      RABBITMQ_CONFIG_FILE: /etc/rabbitmq/external/rabbitmq.conf
      RABBITMQ_ENABLED_PLUGINS_FILE: /etc/rabbitmq/external/enabled_plugins
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbitmq_stream advertised_host rmq
    restart: unless-stopped
    networks:
      default:
        aliases:
          - rmq
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
  seaweedfs:
    extends:
      service: common
      file: docker-compose-common.yml
    image: chrislusf/seaweedfs:4.16
    container_name: seaweedfs
    restart: unless-stopped
    ports:
      - "8333:8333" # S3 API Gateway
    configs:
      - source: seaweedfs_s3_json
        target: /etc/seaweedfs/s3.json
    # Bypass image's /entrypoint.sh wrapper which chowns /data and drops to
    # the seaweed user; we keep the previous root-run behaviour so persistent
    # /data volumes from earlier runs don't need a recursive chown.
    entrypoint: ["/usr/bin/weed"]
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -filer=true -dir=/data -master.volumeSizeLimitMB=1024 -volume.max=500
    environment:
      # Prevents SeaweedFS from trying to replicate volumes; single-node setup has no replica targets
      WEED_MASTER_VOLUME_GROWTH_COPY_1: "1"
    volumes:
      - seaweedfsdata:/data
    networks:
      default:
        aliases:
          - seaweedfs
volumes:
  pgsqldata:
  seaweedfsdata:
networks:
  default:
    name: vpp-network
    external: true
configs:
  rabbitmq_config:
    content: |
      consumer_timeout = 21600000
      mqtt.allow_anonymous = false
      deprecated_features.permit.transient_nonexcl_queues = true
      # Hub 0.4 / Spring AMQP anonymous queues still set x-queue-master-locator.
      deprecated_features.permit.queue_master_locator = true
  rabbitmq_enabled_plugins:
    content: |
      [rabbitmq_management,rabbitmq_mqtt,rabbitmq_prometheus,rabbitmq_stream,rabbitmq_stream_management].
  pgadmin_servers_json:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "smartface",
            "Group": "Servers",
            "Host": "pgsql",
            "Port": 5432,
            "MaintenanceDB": "postgres",
            "Username": "postgres",
            "SSLMode": "prefer",
            "SSLCert": "<STORAGE_DIR>/.postgresql/postgresql.crt",
            "SSLKey": "<STORAGE_DIR>/.postgresql/postgresql.key",
            "SSLCompression": 0,
            "Timeout": 10,
            "UseSSHTunnel": 0,
            "TunnelPort": "22",
            "TunnelAuthentication": 0
          }
        }
      }
  seaweedfs_s3_json:
    content: |-
      {
        "identities": [
          {
            "name": "admin",
            "credentials": [
              { "accessKey": "admin", "secretKey": "admin" }
            ],
            "actions": ["Read", "Write", "List", "Tagging", "Admin"],
            "buckets": ["*"]
          }
        ]
      }
